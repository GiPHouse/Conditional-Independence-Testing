name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust_fmt:
    name: Rust Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Rust Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
            python-version: "3.12"


      - name: Install system dependencies
        run: sudo apt-get install -y libopenblas-dev

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust_test:
    name: Rust Tests
    needs: [rust_fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v5
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --exclude ci_python --exclude cir --exclude ci_js --verbose

      - name: Run tests
        run: cargo test --workspace --exclude ci_python --exclude cir --exclude ci_js --verbose

  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        working-directory: crates/ci-python
        run: ruff format --check .

      - name: Lint
        working-directory: crates/ci-python
        run: ruff check .

  python-test:
    name: Python Tests
    needs: [python-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Python dependencies
        run: pip install maturin pytest numpy mypy

      - name: Build and install extension
        working-directory: crates/ci-python
        run: pip install -e . --no-build-isolation

      - name: Type check
        working-directory: crates/ci-python
        run: mypy tests/

      - name: Run tests
        working-directory: crates/ci-python
        shell: bash
        run: pytest || [ "$?" -eq 5 ]

  r-lint:
    name: R Lint and Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install lintr and styler
        run: install.packages(c("lintr", "styler"))
        shell: Rscript {0}

      - name: Check R formatting
        working-directory: crates/cir
        run: styler::style_pkg(dry = "fail")
        shell: Rscript {0}

      - name: Lint R code
        working-directory: crates/cir
        run: |
          lints <- lintr::lint_package()
          print(lints)
          if (length(lints) > 0) quit(status = 1)
        shell: Rscript {0}

  r-test:
    name: R Package Tests
    needs: [r-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: crates/cir
          extra-packages: any::devtools, any::rextendr

      - name: Generate Makevars and R wrappers
        working-directory: crates/cir
        run: rextendr::document()
        shell: Rscript {0}

      - name: Run R tests
        working-directory: crates/cir
        run: devtools::test(reporter = "summary")
        shell: Rscript {0}

  js-lint:
    name: JS Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ci_js/package-lock.json

      - name: Install dependencies
        working-directory: ci_js
        run: npm ci

      - name: Check formatting
        working-directory: ci_js
        run: npx prettier --check .

      - name: Run ESLint
        working-directory: ci_js
        run: npx eslint .