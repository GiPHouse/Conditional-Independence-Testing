[package]
name = "ci_python"
version = "0.1.0"
edition = "2021"
authors = ["Your Team <team@example.com>"]
license = ""
description = "PyO3 bindings for Conditional Independence Testing"
repository = ""

[dependencies]
ci_core = { path = "../ci-core" }
ndarray = { workspace = true }
numpy = { version = "0.28" }
pyo3 = { version = "0.28", features = ["extension-module"] }
pyo3-stub-gen = "0.22.1"
pyo3-stub-gen-derive = "0.22.1"

[lints]
workspace = true

[lib]
name = "ci_python"
crate-type = ["cdylib", "rlib"]
