[build-system]
requires = ["maturin>=1.0,<2"]
build-backend = "maturin"

[project]
name = "ci-python"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[tool.maturin]
module-name = "ci_python"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
ignore_missing_imports = true
