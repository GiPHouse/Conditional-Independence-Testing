[package]
name = "ci_core"
version = "0.1.0"
edition = "2021"
authors = ["Your Team <team@example.com>"]
license = ""
description = "Conditional Independence Testing"
repository = ""
keywords = ["statistics", "causal-inference", "conditional-independence"]
categories = ["science"]

exclude = [""]

[dependencies]
anyhow = { workspace = true}
ndarray = { workspace = true }
statrs = { workspace = true }
ordered-float = "5.3.0"
rand = "0.9"

[target.'cfg(target_os = "linux")'.dependencies]
ndarray-linalg = { version = "0.18.1", features = ["openblas-system"] }

[target.'cfg(target_os = "macos")'.dependencies]
ndarray-linalg = { version = "0.18.1", features = ["openblas-system"] }

[target.'cfg(windows)'.dependencies]
ndarray-linalg = { version = "0.18.1", features = ["intel-mkl-static"] }

[dev-dependencies]
criterion = { workspace = true }
proptest = { workspace = true }
rand_distr = "0.5"

[lints]
workspace = true

[lib]

[[bench]]
name = "contingency_test_bench"
harness = false