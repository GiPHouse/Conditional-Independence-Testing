<!DOCTYPE html>
<html>
<body>
<pre id="result"></pre>
<script type="module">
import init, { JSCITest } from "./pkg/ci_js.js";

await init();

try {
    const result = JSCITest.run_test(
        "pearson_correlation",
        new Float64Array([1, 1,1,1,1]),
        5,1,
        new Float64Array([1, 2, 3, 4, 5]),
        new Float64Array([1, 2, 3, 4, 5]),
        true,
        0.05
    );
    document.getElementById("result").textContent =
        `result: ${result}`;
} catch (e) {
    document.getElementById("result").textContent = `Error: ${e}`;
}
</script>
</body>
</html>
